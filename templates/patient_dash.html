{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
    <h2 class="mb-4 text-center">Patient Dashboard</h2>

    <div class="card shadow-sm p-4">
        <h5 class="text-primary">Welcome, {{ current_user.user_name }} 👋</h5>
        <p class="mt-3">
            View your upcoming appointments, prescriptions, and medical history here.
        </p>

        <div class="alert alert-info mt-4" role="alert">
            This section will soon display appointment history and prescription details.
        </div>
    </div>
</div>

{% endblock %}
