{% extends "base.html" %}
{% block content %}

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #bcdcff, #eef7ff, #c7e2ff);
    font-family: "Poppins", sans-serif;
    overflow: hidden;
  }

  nav.navbar {
    display: none !important;
  }

  /* Top Buttons */
  .top-right {
    position: absolute;
    top: 25px;
    right: 50px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 10;
  }

  .dropdown .btn {
    background: white;
    color: #15406f;
    border: 2px solid #8cc4ff;
    border-radius: 10px;
    font-weight: 600;
    transition: 0.3s ease;
    padding: 7px 16px;
  }
  .dropdown .btn:hover {
    background: #87baff;
    color: white;
  }

  .btn-register {
    background: linear-gradient(90deg,#6ea8ff,#4b79ff);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 9px 20px;
    font-weight: 600;
    transition: 0.25s ease;
    text-decoration: none !important;
  }
  .btn-register:hover {
    transform: translateY(-3px);
    background: linear-gradient(90deg,#4b79ff,#365adf);
  }

  /* Hero Section */
  .hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .care-text {
    font-size: 0.9rem;
    color: #3a4b63;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
    opacity: 0;
    animation: fadeUp 1.4s ease-out forwards;
  }

  .medilife-title {
    font-family: "DM Serif Display", serif;
    font-size: 4.7rem;
    font-weight: 600;
    color: #2f5f97;
    opacity: 0;
    animation: fadeUp 1.2s ease-out forwards, pulse 4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }

  .tagline {
    font-size: 1.1rem;
    margin-top: 8px;
    color: #445b77;
    opacity: 0;
    animation: fadeIn 1.5s ease-out forwards 0.5s;
  }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(25px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

</style>

<!-- Top login/register -->
<div class="top-right">
  <div class="dropdown">
    <button class="btn dropdown-toggle" data-bs-toggle="dropdown">Login</button>
    <ul class="dropdown-menu dropdown-menu-end">
      <li><a class="dropdown-item" href="{{ url_for('main.login') }}?role=admin">Admin</a></li>
      <li><a class="dropdown-item" href="{{ url_for('main.login') }}?role=doctor">Doctor</a></li>
      <li><a class="dropdown-item" href="{{ url_for('main.login') }}?role=patient">Patient</a></li>
    </ul>
  </div>
  <a href="{{ url_for('main.register') }}" class="btn-register">Register as Patient</a>
</div>

<!-- Center Content -->
<div class="hero">
  <p class="care-text">We care for you</p>
  <h1 class="medilife-title">Welcome to MediLife</h1>
  <p class="tagline">Your digital partner for modern healthcare management</p>
</div>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">

{% endblock %}
