{% extends "doctor_base.html" %}
{% block doctor_content %}

<div class="p-4" style="font-family:'Poppins',sans-serif;">
  <h2 style="font-weight:700;color:#065f46;">Set Your Availability</h2>
  <p style="color:#555;">Provide your available slots for the next 7 days.</p>

  <div class="card shadow-sm mt-4" 
       style="border-radius:16px;border:none;background:linear-gradient(180deg,#ffffff,#f9fffb);">
    <div class="card-body">
      <form method="POST" action="{{ url_for('main.update_doctor_availability') }}">
        <div class="table-responsive">
          <table class="table align-middle text-center" 
                 style="border-collapse:separate;border-spacing:0 8px;">
            <thead>
              <tr style="background:#e8f9ee;color:#065f46;">
                <th>Date</th>
                <th>Day</th>
                <th>Start Time</th>
                <th>End Time</th>
                <th>Availability</th>
              </tr>
            </thead>

            <tbody>
              {% for day in next_7_days %}
              <tr style="background:#ffffff;box-shadow:0 2px 6px rgba(0,0,0,0.05);">
                <td>{{ day.date }}</td>
                <td>{{ day.weekday }}</td>

                <!--Start Time-->
                <td>
                  <input type="time" 
                         name="start_time_{{ loop.index }}" 
                         class="form-control"
                         value="{{ availability.get(day.date, {}).get('start','') }}"
                         style="border-radius:10px;border:1px solid #cfead9;">
                </td>

                <!--End Time-->
                <td>
                  <input type="time" 
                         name="end_time_{{ loop.index }}" 
                         class="form-control"
                         value="{{ availability.get(day.date, {}).get('end','') }}"
                         style="border-radius:10px;border:1px solid #cfead9;">
                </td>

                <!-- Yes/No button -->
                <td>
                  <div class="d-flex justify-content-center align-items-center gap-3">
                    <div class="form-check">
                      <input class="form-check-input" 
                             type="radio" 
                             name="available_{{ loop.index }}" 
                             id="yes{{ loop.index }}" 
                             value="yes"
                             {% if availability.get(day.date, {}).get('available') %}checked{% endif %}>
                      <label class="form-check-label text-success fw-semibold" for="yes{{ loop.index }}">Yes</label>
                    </div>

                    <div class="form-check">
                      <input class="form-check-input" 
                             type="radio" 
                             name="available_{{ loop.index }}" 
                             id="no{{ loop.index }}" 
                             value="no"
                             {% if not availability.get(day.date, {}).get('available') %}checked{% endif %}>
                      <label class="form-check-label text-danger fw-semibold" for="no{{ loop.index }}">No</label>
                    </div>
                  </div>
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>

        <div class="text-end mt-4">
          <button type="submit" class="btn btn-success px-4 py-2"
                  style="border-radius:10px;background:#0b8a54;border:none;font-weight:500;">
            Save Availability
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
