{% extends "admin_base.html" %}
{% block content %}

<style>
  body {
    background: linear-gradient(135deg, #eaf3ff, #f6faff);
    font-family: "Inter", sans-serif;
  }

  .dashboard-container {
    animation: fadeIn 1s ease-in-out;
    padding: 40px 20px;
    text-align: center;
  }

  .dashboard-title {
    font-size: 2.8rem;
    font-weight: 800;
    color: #0d47a1;
    margin-bottom: 10px;
  }

  .dashboard-subtitle {
    font-size: 1.2rem;
    color: #5f6f87;
    margin-bottom: 40px;
  }

  /* Cards Container */
  .cards-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25px;
    margin-top: 20px;
  }

  /* Individual Card */
  .stat-card {
    width: 450px;
    padding: 24px;
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    font-weight: 700;
    transition: 0.3s;
  }

  .stat-card:hover {
    transform: scale(1.03);
  }

  .stat-title {
    font-size: 1.2rem;
    margin-bottom: 8px;
    color: #333;
  }

  .stat-value {
    font-size: 2.6rem;
    font-weight: 900;
    margin-top: 8px;
  }

  /* Card Colors */
  .blue-card {
    background: linear-gradient(135deg, #dceefb, #b3e5fc);
  }

  .green-card {
    background: linear-gradient(135deg, #e2fbe8, #b2f2bb);
  }

  .yellow-card {
    background: linear-gradient(135deg, #fff4cc, #ffeaa7);
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>


<div class="dashboard-container">

  <h1 class="dashboard-title">Welcome, Admin</h1>
  <p class="dashboard-subtitle">Effortlessly monitor and manage MediLife operations.</p>

  <div class="cards-wrapper">

    <div class="stat-card blue-card">
      <div class="stat-title">Total Doctors</div>
      <div class="stat-value">{{ total_doctors }}</div>
    </div>

    <div class="stat-card green-card">
      <div class="stat-title">Total Patients</div>
      <div class="stat-value">{{ total_patients }}</div>
    </div>

    <div class="stat-card yellow-card">
      <div class="stat-title">Total Appointments</div>
      <div class="stat-value">{{ total_appointments }}</div>
    </div>

  </div>

</div>

{% endblock %}
